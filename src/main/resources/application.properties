spring.application.name=distributed-payment-ledger

# Standalone live demo mode (Runs embedded H2 DB + local locks + local cache if Kafka/Redis/Postgres not running)
payment.standalone-demo.enabled=true

# Database Configuration (Embedded in-memory H2 database for live demo)
spring.datasource.url=jdbc:h2:mem:paymentdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=PostgreSQL
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update

# Enable H2 Web Console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Virtual Threads
spring.threads.virtual.enabled=true

# Outbox Publisher Poller Interval
payment.outbox.poll-rate-ms=1000

# Actuator Endpoints
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
